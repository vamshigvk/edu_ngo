version: '3.9'
services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:///./data/app.db
      ALLOWED_ORIGINS: http://localhost:3000
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
