<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#f8fbff"/>
  <text x="700" y="60" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#12324f">AWS Architecture for FFG Education Portal</text>
  <text x="700" y="90" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4b5563">React frontend, FastAPI backend, authentication, storage, and monitoring on AWS</text>

  <rect x="70" y="120" width="1260" height="700" rx="24" fill="#eef6ff" stroke="#4a6fdc" stroke-width="2"/>
  <text x="100" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#1e3a8a">AWS Cloud</text>

  <rect x="120" y="220" width="200" height="90" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#1d4ed8">Users</text>
  <text x="220" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">Admin / Mentor / Mentee / Student</text>

  <rect x="380" y="220" width="220" height="90" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="490" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#166534">CloudFront</text>
  <text x="490" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">Global CDN + HTTPS</text>

  <rect x="660" y="220" width="220" height="90" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="770" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#92400e">S3 Bucket</text>
  <text x="770" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">React frontend hosting</text>

  <rect x="380" y="380" width="220" height="90" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="490" y="415" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#6d28d9">Amazon Cognito</text>
  <text x="490" y="440" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">Authentication &amp; roles</text>

  <rect x="660" y="380" width="220" height="90" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="770" y="415" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#b91c1c">API Gateway</text>
  <text x="770" y="440" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">Secure API entry point</text>

  <rect x="940" y="380" width="220" height="90" rx="16" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="1050" y="415" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#047857">ECS Fargate</text>
  <text x="1050" y="440" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">FastAPI application</text>

  <rect x="520" y="560" width="220" height="90" rx="16" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="630" y="595" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#374151">Amazon RDS</text>
  <text x="630" y="620" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">PostgreSQL / MySQL data</text>

  <rect x="780" y="560" width="220" height="90" rx="16" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="890" y="595" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#374151">S3 Documents</text>
  <text x="890" y="620" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">Uploads and attachments</text>

  <rect x="1040" y="560" width="220" height="90" rx="16" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="1150" y="595" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#374151">CloudWatch</text>
  <text x="1150" y="620" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">Logs, metrics, alerts</text>

  <line x1="320" y1="265" x2="380" y2="265" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="265" x2="660" y2="265" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="310" x2="490" y2="380" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="770" y1="310" x2="770" y2="380" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="880" y1="425" x2="940" y2="425" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1050" y1="470" x2="1050" y2="560" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="940" y1="425" x2="880" y2="425" stroke="#64748b" stroke-width="2"/>
  <line x1="770" y1="470" x2="770" y2="560" stroke="#64748b" stroke-width="2"/>
  <line x1="630" y1="650" x2="770" y2="650" stroke="#64748b" stroke-width="2"/>
  <line x1="770" y1="650" x2="770" y2="560" stroke="#64748b" stroke-width="2"/>
  <line x1="890" y1="650" x2="890" y2="560" stroke="#64748b" stroke-width="2"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
